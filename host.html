<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>靈魂拷問 主持人 Soul Questions Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-role="host">
<div class="wrap">
  <div class="banner" id="banner" hidden></div>
  <section class="login" id="login" hidden>
    <h1>主持人登入</h1>
    <p class="en">Host sign-in</p>
    <form id="loginForm" class="login">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">密碼 Password</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button class="hbtn pri" type="submit">登入 Sign in</button>
      <div class="err" id="loginErr" role="alert"></div>
    </form>
  </section>
  <div id="app" hidden>
    <header class="top">
      <div class="brand"><b>靈魂拷問</b><i>Host</i></div>
      <nav class="tabs" id="tabs" aria-label="題目 Questions"></nav>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">連線中… Connecting…</span></div>
      <button class="hbtn" id="signOut" type="button">登出 Sign out</button>
    </header>
    <main id="main"></main>
    <div id="hostMount"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
